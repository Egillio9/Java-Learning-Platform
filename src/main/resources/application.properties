spring.application.name=java-learning-platform
server.port=${PORT:8080}
# Render terminates TLS in front of the app; trust its X-Forwarded-* headers (needed for OAuth redirect URLs)
server.forward-headers-strategy=framework

# File-based H2 by default so progress survives restarts.
# Point DB_URL / DB_USERNAME / DB_PASSWORD at PostgreSQL for a shared deployment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/javalearn;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE:false}

# Sessions
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Code judge (see judge/CodeRunner.java)
judge.time-limit=${JUDGE_TIME_LIMIT:10s}
judge.memory-mb=${JUDGE_MEMORY_MB:96}
judge.max-concurrent=${JUDGE_MAX_CONCURRENT:1}
judge.max-output-bytes=1000000
judge.max-source-chars=20000

# Google sign-in: start with SPRING_PROFILES_ACTIVE=google plus GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# (see application-google.properties). Without it, guest sign-in by name is the only option.
